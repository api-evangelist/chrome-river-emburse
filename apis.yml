aid: chrome-river-emburse
name: Chrome River (Emburse)
description: >-
  Chrome River is an enterprise travel and expense (T&E) management platform now
  part of Emburse, offering expense reporting, invoice management, corporate card
  reconciliation, and travel spend controls for large and global organizations.
  The chromeriver.com brand now redirects to Emburse Enterprise; expense, invoice,
  and analytics data are exchanged through Emburse's gated API host (api.emburse.com)
  and app.chromeriver.com sign-in. Emburse publishes a broad compliance posture
  (SOC 1/2 Type 2, ISO/IEC 27001/27701/42001, PCI DSS, GDPR/CCPA/CPRA, TX-RAMP)
  via its trust center and operates a public responsible-disclosure program and
  Atlassian-hosted status page. This profile was surfaced as a Bain Capital Ventures
  portfolio lead and enriched by the API Evangelist pipeline from Emburse's public
  surface; no open developer portal or OpenAPI is published, so spec-bearing
  artifacts are intentionally absent.
